[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "goodix5385"
version = "0.3.0"
description = "Goodix 5385 fingerprint GUI — enroll, verify, delete. For Arch/Hyprland."
authors = [
    {name = "sanecodeguy"},
]
dependencies = [
    "PySide6>=6.6",
    "pyusb>=1.2",
]

[project.scripts]
goodix = "goodix5385.gui.main:main"
goodix5385-gui = "goodix5385.gui.main:main"
goodix5385-usb-reset = "goodix5385.scripts.usb_reset:main"

[tool.setuptools]
packages = ["goodix5385", "goodix5385.gui", "goodix5385.scripts"]
